[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ship-check"
version = "0.2.0"
description = "A Python CLI that checks release readiness and generates changelogs, version bumps, and release notes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Nitish Vimal" }
]
keywords = [
  "python",
  "cli",
  "release",
  "changelog",
  "semantic-versioning",
  "developer-tools",
  "github"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Version Control :: Git"
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "PyYAML>=6.0.1",
  "tomli>=2.0.1; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[project.urls]
Homepage = "https://github.com/n-vim/ship-check"
Repository = "https://github.com/n-vim/ship-check"
Issues = "https://github.com/n-vim/ship-check/issues"

[project.scripts]
shipcheck = "shipcheck.cli:app"
ship-check = "shipcheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shipcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"
